<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotízalo · Nueva Cotización</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen">

<div class="flex flex-col md:flex-row min-h-screen w-full">
  
  <!-- Sidebar Cotízalo -->
  <aside class="w-full md:w-64 shrink-0 bg-[#f8fafc] border-b md:border-b-0 md:border-r border-[#e2e8f0] flex flex-col justify-between p-4 md:p-5 select-none">
    <div>
      <!-- Brand Header -->
      <div class="flex items-center gap-3 px-2 py-1 mb-6">
        <div class="w-10 h-10 rounded-xl bg-[#141c31] text-[#02cbdd] border border-slate-700 flex items-center justify-center font-extrabold text-xl shadow-sm">
          C
        </div>
        <div>
          <h1 class="font-extrabold text-[#141c31] text-base leading-tight tracking-tight">Cotízalo</h1>
          <p class="text-xs text-slate-500 font-medium">by PUKIO</p>
        </div>
      </div>

      <!-- Navigation Section -->
      <div class="nav-category">OPERACIÓN</div>
      <nav class="space-y-1.5">
        <a href="/index.html" class="nav-item active">
          <svg class="w-5 h-5 text-[#02cbdd]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          <span>Nueva cotización</span>
        </a>
        <a href="/cotizaciones.html" class="nav-item">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
          </svg>
          <span class="flex-1">Cotizaciones</span>
          <span id="badgeCount" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">0</span>
        </a>
      </nav>
    </div>

    <!-- Sidebar Footer -->
    <div class="pt-4 border-t border-[#e2e8f0] flex items-center justify-between px-1 mt-auto">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-[#e0f9fb] text-[#083344] font-extrabold flex items-center justify-center text-xs">
          CZ
        </div>
        <div>
          <p class="text-xs font-bold text-slate-900 leading-tight">Cotízalo Pro</p>
          <p class="text-[11px] text-slate-500 font-medium">PUKIO</p>
        </div>
      </div>
      <span class="text-slate-400 text-xs font-bold">&lt;</span>
    </div>
  </aside>

  <!-- Main Full-Width Content Container -->
  <main class="flex-1 w-full min-h-screen bg-white p-4 md:p-8 flex flex-col">
    
    <!-- Top Bar -->
    <div class="w-full flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 mb-6 border-b border-neutral-200">
      <div class="min-w-0">
        <span class="text-[11px] font-bold text-neutral-400 uppercase tracking-wider">COTIZACIÓN ACTIVA</span>
        <div class="flex items-center gap-3 mt-0.5">
          <h2 id="activeCodeTitle" class="text-lg md:text-xl font-extrabold text-[#141c31] tracking-tight truncate">
            (Nueva cotización)
          </h2>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center flex-wrap gap-2 shrink-0">
        <button onclick="createNewQuotation()" class="btn sec text-xs py-2 px-3" title="Crear nueva cotización limpia">
          <span>+ Nueva</span>
        </button>
        <button onclick="duplicateCurrentQuotation()" class="btn sec text-xs py-2 px-3" title="Duplicar cotización actual">
          <span>Duplicar</span>
        </button>
        <button id="btnSaveDB" onclick="saveToDatabase()" class="btn pri text-xs py-2 px-4">
          <span id="saveLabel">Guardar</span>
        </button>
      </div>
    </div>

    <!-- Steps Nav -->
    <nav id="steps" class="flex gap-1 overflow-x-auto border-b border-neutral-300 pb-1 mb-6"></nav>
    
    <!-- Step Content -->
    <div id="step_content" class="space-y-4 w-full"></div>

    <!-- Step Navigation Footer -->
    <footer id="nav" class="flex justify-between mt-auto pt-6 border-t border-neutral-300 w-full"></footer>

  </main>
</div>

<!-- Modal Overlays -->
<div id="ov" class="hidden"></div>

<script src="/js/core.js"></script>
<script src="/js/pdf.js"></script>
<script src="/js/editor.js"></script>
</body>
</html>
